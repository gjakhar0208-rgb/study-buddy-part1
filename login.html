<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your StudyBuddy account.">
  <title>Log In | StudyBuddy</title>
  <style>
    :root { color-scheme: light; --ink: #1E1B2E; --muted: #666477; --lavender: #EAE6FF; --purple: #8B70EE; --mint: #E8F7EE; --green: #4CAF78; --line: #E9E6F1; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; color: #1E1B2E; background: linear-gradient(135deg, #E6F7EF 0%, #EDE7FF 100%) !important; font-family: 'Poppins', 'Inter', sans-serif; }
    a { color: inherit; }
    .wrap { width: min(100%, 460px); }
    .brand { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 800; font-size: 1.08rem; text-decoration: none; }
    .app-logo-frame { width: 48px; height: 48px; flex: 0 0 48px; overflow: hidden; border-radius: 50%; }
    .app-logo { display: block; width: 100%; height: 100%; object-fit: contain; transform: scale(1.3); transform-origin: 50% 20%; }
    .card { padding: clamp(26px, 6vw, 42px); border: 1px solid rgba(255,255,255,.8); border-radius: 20px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(139, 112, 238, 0.08); backdrop-filter: blur(12px); }
    h1 { margin: 0 0 8px; font-size: 1.85rem; line-height: 1.2; letter-spacing: 0; }
    .intro { margin: 0 0 28px; color: var(--muted); }
    .field { margin-bottom: 19px; }
    label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 700; }
    input { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: white; font: inherit; }
    input:focus { outline: 3px solid rgba(139,112,238,.2); border-color: var(--purple); }
    .submit { width: 100%; min-height: 50px; margin-top: 5px; border: 0; border-radius: 999px; color: white; background: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
    .submit:hover { background: #39334F; }
    .footer { margin: 23px 0 0; color: var(--muted); text-align: center; font-size: .92rem; }
    .footer a { color: #6248C2; font-weight: 700; text-underline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="index.html"><span class="app-logo-frame"><img src="logo.png" alt="StudyBuddy Logo" class="app-logo"></span><span>StudyBuddy</span></a>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Welcome back</h1>
      <p class="intro">Log in to find your next great study session.</p>
      <form action="dashboard.html" method="post">
        <div class="field"><label for="email">College Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="submit" type="submit">Log In</button>
      </form>
      <p class="footer">Don't have an account? <a href="signup.html">Sign up here</a></p>
    </section>
  </main>
<script>   document.querySelector('form').addEventListener('submit', (event) => {     const form = event.currentTarget;     if (!form.checkValidity()) return;     event.preventDefault();     let notice = document.getElementById('demo-notice');     if (!notice) {       notice = document.createElement('p');       notice.id = 'demo-notice';       notice.setAttribute('role', 'status');       notice.style.cssText = 'margin: 16px 0 0; color: #6248C2; text-align: center;';       form.append(notice);     }     notice.textContent = 'This is a front-end demo. Login is not connected and no information was sent or saved.';   }); </script> </body>
</html>
